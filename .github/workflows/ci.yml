name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: swift --version
      - run: make check
