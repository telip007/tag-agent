name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked the agent and what it printed. Redact API keys and anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: environment
    attributes:
      label: Swift version, macOS version and model
      placeholder: Swift 6.2, macOS 26, deepseek/deepseek-v4.1-flash
    validations:
      required: true
